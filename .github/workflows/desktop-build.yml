name: CI and Desktop Builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Build, type-check and unit-test
        run: npm run build

  build-linux:
    name: Build Linux AppImage and Debian package
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux packaging prerequisites
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg
      - name: Install locked dependencies
        run: npm ci
      - name: Build and package
        run: npm run build:linux
      - name: Generate SHA-256 checksums
        shell: bash
        run: cd release && sha256sum *.AppImage *.deb > SHA256SUMS-Linux.txt
      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS-Linux.txt
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows x64 installer
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Download official Microsoft Visual C++ runtime prerequisite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/vc14/vc_redist.x64.exe" -OutFile "build/vc_redist.x64.exe"
          if ((Get-Item "build/vc_redist.x64.exe").Length -lt 1000000) {
            throw "Visual C++ runtime download is unexpectedly small."
          }
      - name: Install locked dependencies
        run: npm ci
      - name: Verify installer prerequisite is present
        shell: pwsh
        run: |
          if (!(Test-Path "build/vc_redist.x64.exe")) {
            throw "Missing build/vc_redist.x64.exe after dependency installation."
          }
          Write-Output "VC++ runtime prerequisite is present."
      - name: Build and package
        run: npm run build:win:ci
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  publish-github-release:
    name: Publish versioned GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Download Linux installers
        uses: actions/download-artifact@v4
        with:
          name: linux-installers
          path: release-assets
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets
      - name: Validate tag matches app version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "Git tag $RELEASE_TAG does not match package.json version $APP_VERSION"
            exit 1
          fi
      - name: Publish installers to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes
