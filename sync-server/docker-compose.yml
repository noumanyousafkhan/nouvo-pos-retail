services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: nouvo_sync
      POSTGRES_USER: nouvo_sync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
    volumes:
      - nouvo_sync_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nouvo_sync -d nouvo_sync']
      interval: 5s
      timeout: 3s
      retries: 20
  sync-server:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '8787'
      DATABASE_URL: postgres://nouvo_sync:${POSTGRES_PASSWORD}@postgres:5432/nouvo_sync
      HOST: 0.0.0.0
      SYNC_ADMIN_TOKEN: ${SYNC_ADMIN_TOKEN:-}
    ports:
      - '127.0.0.1:8787:8787'
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  nouvo_sync_data:
